<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>冯意欢的实验室 · Yihuan's Lab</title>
  <meta name="description" content="9 岁小创作者的编程作品集：2048 游戏、3D 太阳系、声控涂鸦、科学实验等互动作品，都在浏览器里直接体验。">
  <meta name="author" content="Yihuan 冯意欢">
  <meta name="keywords" content="编程, 儿童编程, 2048, Three.js, 太阳系, 声控涂鸦, 科学实验, HTML5 游戏">

  <meta property="og:title" content="冯意欢的实验室 · Yihuan's Lab">
  <meta property="og:description" content="9 岁小创作者的编程作品集：游戏、3D、创意、视觉与科学实验。">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    // 在页面绘制前恢复主题，避免闪烁
    ;(function () {
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t)
        }
      } catch (e) {}
    })()
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
