<body data-doubao-line="145" data-doubao-column="1">
<div class="title" data-doubao-line="146" data-doubao-column="1" data-doubao-key="0">科学小实验</div>

<div class="task" data-doubao-line="148" data-doubao-column="1" data-doubao-key="1">
任务：找出哪种组合能产生气体，把瓶塞顶出来<br data-doubao-line="149" data-doubao-column="22" data-doubao-key="2">
操作：1.把材料拖进瓶子  2.拖入瓶盖  3.点击开始实验
</div>

<div class="stage" id="stage" data-doubao-line="153" data-doubao-column="1" data-doubao-key="3">
  <div class="bottle" id="bottle" data-doubao-line="154" data-doubao-column="3" data-doubao-key="4">
    <div class="neck" data-doubao-line="155" data-doubao-column="5" data-doubao-key="5"></div>
    <div class="liquid" id="liquid" data-doubao-line="156" data-doubao-column="5" data-doubao-key="6"></div>
  </div>
  <div class="cap" id="cap-on-bottle" data-doubao-line="158" data-doubao-column="3" data-doubao-key="7"></div>

  <div class="drag-item" id="vinegar" data-doubao-line="160" data-doubao-column="3" data-doubao-key="8">白醋</div>
  <div class="drag-item" id="soda" data-doubao-line="161" data-doubao-column="3" data-doubao-key="9">小苏打</div>
  <div class="drag-item" id="sugar" data-doubao-line="162" data-doubao-column="3" data-doubao-key="10">糖</div>
  <div class="drag-item" id="salt" data-doubao-line="163" data-doubao-column="3" data-doubao-key="11">盐</div>
  <div class="drag-item" id="water" data-doubao-line="164" data-doubao-column="3" data-doubao-key="12">水</div>
  <div class="drag-item" id="cap-item" data-doubao-line="165" data-doubao-column="3" data-doubao-key="13">瓶盖</div>

  <button id="startBtn" data-doubao-line="167" data-doubao-column="3" data-doubao-key="14">开始实验</button>
  <div id="result" data-doubao-line="168" data-doubao-column="3" data-doubao-key="15"></div>
</div>

<script data-doubao-line="171" data-doubao-column="1" data-doubao-key="16">
let currentDrag = null;
let offsetX = 0;
let offsetY = 0;
let contents = [];
let hasCap = false;

const startBtn = document.getElementById('startBtn');
const result = document.getElementById('result');
const capOnBottle = document.getElementById('cap-on-bottle');
const liquid = document.getElementById('liquid');

document.querySelectorAll('.drag-item').forEach(el => {
  el.addEventListener('mousedown', startDrag);
  el.addEventListener('touchstart', startDrag, {passive:false});
  el.addEventListener('mouseup', endDrag);
  el.addEventListener('touchend', endDrag);
});

document.addEventListener('mousemove', dragMove);
document.addEventListener('touchmove', dragMove, {passive:false});

function startDrag(e){
  e.preventDefault();
  currentDrag = this;
  let x = e.clientX || e.touches[0].clientX;
  let y = e.clientY || e.touches[0].clientY;
  let rect = currentDrag.getBoundingClientRect();
  offsetX = x - rect.left;
  offsetY = y - rect.top;
  currentDrag.style.zIndex = 100;
}

function dragMove(e){
  if(!currentDrag) return;
  e.preventDefault();
  let x = e.clientX || e.touches[0].clientX;
  let y = e.clientY || e.touches[0].clientY;
  let stageRect = document.getElementById('stage').getBoundingClientRect();
  let left = x - stageRect.left - offsetX;
  let top = y - stageRect.top - offsetY;
  currentDrag.style.left = left + 'px';
  currentDrag.style.top = top + 'px';
}

function endDrag(e){
  if(!currentDrag) return;
  let bottle = document.getElementById('bottle');
  let bRect = bottle.getBoundingClientRect();
  let elRect = currentDrag.getBoundingClientRect();

  let inBottle = (
    elRect.right > bRect.left &&
    elRect.left < bRect.right &&
    elRect.bottom > bRect.top &&
    elRect.top < bRect.bottom
  );

  let name = currentDrag.id;
  if(inBottle){
    currentDrag.style.display = 'none';
    if(name == 'cap-item'){
      capOnBottle.style.display = 'block';
      hasCap = true;
    }else{
      contents.push(name);
      liquid.style.height = '100px';
    }
  }

  if(contents.length > 0 && hasCap){
    startBtn.style.display = 'block';
  }

  currentDrag.style.zIndex = 1;
  currentDrag = null;
}

startBtn.addEventListener('click', () => {
  startBtn.style.display = 'none';
  result.style.display = 'block';

  let hasVinegar = contents.includes('vinegar');
  let hasSoda = contents.includes('soda');

  if(hasVinegar && hasSoda){
    result.textContent = '成功！产生大量气体，瓶塞被顶飞啦！';
    capOnBottle.classList.add('fly');
    liquid.style.height = '180px';
  }else{
    result.textContent = '没有产生足够气体，瓶塞没有被顶出。';
  }
});
</script>
