<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>终极版：白色背景+画笔+橡皮擦+撤销+继续+声控</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 全局白色背景 + 黑色文字 */
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
            color: #000000;
            position: relative;
        }

        /* 调试面板 */
        .debug-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(240, 240, 240, 0.9);
            color: #000000;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            z-index: 1000;
            min-width: 280px;
            border: 1px solid #ccc;
        }

        .debug-panel h3 {
            margin-bottom: 10px;
            color: #000;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }

        .debug-item {
            margin: 5px 0;
        }

        .debug-label {
            color: #333;
        }

        .debug-value {
            color: #0066ff;
            font-weight: bold;
        }

        .volume-bar-container {
            width: 100%;
            height: 20px;
            background: #ddd;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }

        .volume-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ff00, #ffff00, #ff0000);
            transition: width 0.05s linear;
        }

        /* 画笔控制面板 */
        .pen-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(240, 240, 240, 0.9);
            padding: 20px;
            border-radius: 10px;
            z-index: 1000;
            border: 1px solid #ccc;
            min-width: 260px;
        }

        .pen-panel h3 {
            margin-bottom: 15px;
            color: #000;
            font-size: 16px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }

        /* 颜色+橡皮擦选择器 */
        .color-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .color-btn, .eraser-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #666;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .color-btn:hover, .eraser-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active, .eraser-btn.active {
            transform: scale(1.2);
            box-shadow: 0 0 10px #0066ff;
        }

        /* 橡皮擦按钮样式 */
        .eraser-btn {
            background: #ffffff;
            color: #000;
            border: 2px dashed #666;
        }

        /* 自定义颜色 */
        #customColor {
            width: 100%;
            height: 35px;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 15px;
            background: transparent;
        }

        /* 粗细调节 */
        .size-group {
            margin-top: 10px;
        }

        .size-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-size: 14px;
        }

        #sizeSlider {
            width: 100%;
            accent-color: #0066ff;
            cursor: pointer;
        }

        #sizeText {
            color: #000;
            font-size: 14px;
            margin-left: 5px;
        }

        /* 提示文字 */
        #hint {
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
            opacity: 0.9;
            max-width: 80%;
            line-height: 1.5;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: #000;
        }

        /* 绘画区域容器 */
        .draw-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        /* 手绘画布 - 白色背景 */
        #drawCanvas {
            border: 2px solid #0066ff;
            border-radius: 12px;
            background: #ffffff;
            cursor: crosshair;
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.2);
        }

        /* 永久固定按钮组 */
        .btn-group {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 999;
        }

        .control-btn {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 500;
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* 绘画完成按钮 */
        #finishBtn {
            background: linear-gradient(90deg, #66d9ff, #0066ff);
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.3);
        }

        #finishBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 102, 255, 0.4);
        }

        /* 继续绘画按钮 - 初始隐藏 */
        #continueBtn {
            background: linear-gradient(90deg, #66ff66, #00cc00);
            box-shadow: 0 4px 15px rgba(0, 204, 0, 0.3);
            display: none;
        }

        #continueBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 204, 0, 0.4);
        }

        /* 撤销按钮 */
        #undoBtn {
            background: linear-gradient(90deg, #ffcc00, #ff9900);
            box-shadow: 0 4px 15px rgba(255, 153, 0, 0.3);
        }

        #undoBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 153, 0, 0.4);
        }

        /* 重新绘画按钮 */
        #resetBtn {
            background: linear-gradient(90deg, #ff6666, #cc0000);
            box-shadow: 0 4px 15px rgba(204, 0, 0, 0.3);
        }

        #resetBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(204, 0, 0, 0.4);
        }

        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* 声控图形展示容器 */
        .graphics-container {
            position: relative;
            display: none;
            align-items: center;
            justify-content: center;
        }

        /* 手绘图形展示画布 */
        #graphicsCanvas {
            transform-origin: center center;
            transform: scale(1);
            transition: transform 0.05s ease-out;
            filter: drop-shadow(0 0 20px rgba(0, 102, 255, 0.8));
        }
    </style>
</head>
<body>
    <!-- 调试面板 -->
    <div class="debug-panel">
        <h3>🔧 调试信息面板</h3>
        <div class="debug-item">
            <span class="debug-label">状态：</span>
            <span class="debug-value" id="statusText">等待绘画</span>
        </div>
        <div class="debug-item">
            <span class="debug-label">原始音量(RMS)：</span>
            <span class="debug-value" id="rmsValue">0.000</span>
        </div>
        <div class="debug-item">
            <span class="debug-label">归一化音量：</span>
            <span class="debug-value" id="normValue">0.00</span>
        </div>
        <div class="debug-item">
            <span class="debug-label">当前缩放：</span>
            <span class="debug-value" id="scaleValue">1.00x</span>
        </div>
        <div class="volume-bar-container">
            <div class="volume-bar" id="volumeBar"></div>
        </div>
    </div>

    <!-- 画笔控制面板 -->
    <div class="pen-panel">
        <h3>🎨 画笔 / 橡皮擦</h3>
        <div class="color-group">
            <!-- 橡皮擦按钮 -->
            <div class="eraser-btn" id="eraserBtn" title="橡皮擦">🧽</div>
            <!-- 彩色画笔 -->
            <div class="color-btn active" style="background: #0066ff; color: #0066ff;" data-color="#0066ff"></div>
            <div class="color-btn" style="background: #ff0000; color: #ff0000;" data-color="#ff0000"></div>
            <div class="color-btn" style="background: #ffff00; color: #ffff00;" data-color="#ffff00"></div>
            <div class="color-btn" style="background: #00ff00; color: #00ff00;" data-color="#00ff00"></div>
            <div class="color-btn" style="background: #ff00ff; color: #ff00ff;" data-color="#ff00ff"></div>
            <div class="color-btn" style="background: #000000; color: #000000;" data-color="#000000"></div>
            <div class="color-btn" style="background: #ff9900; color: #ff9900;" data-color="#ff9900"></div>
            <div class="color-btn" style="background: #9900ff; color: #9900ff;" data-color="#9900ff"></div>
        </div>
        <input type="color" id="customColor">
        <div class="size-group">
            <label>画笔/橡皮擦大小：<span id="sizeText">4</span>px</label>
            <input type="range" id="sizeSlider" min="1" max="20" value="4">
        </div>
    </div>

    <!-- 提示文字 -->
    <p id="hint">按住鼠标绘画 | 橡皮擦可擦除 | 撤销逐笔回退 | 完成后可继续绘画 | 声控特效</p>

    <!-- 绘画区域 -->
    <div class="draw-container" id="drawContainer">
        <canvas id="drawCanvas" width="800" height="500"></canvas>
    </div>

    <!-- 声控图形展示区域 -->
    <div class="graphics-container" id="graphicsContainer">
        <canvas id="graphicsCanvas"></canvas>
    </div>

    <!-- 永久固定按钮组：完成 + 继续 + 撤销 + 重画 -->
    <div class="btn-group">
        <button id="finishBtn" class="control-btn">绘画完成</button>
        <button id="continueBtn" class="control-btn">继续绘画</button>
        <button id="undoBtn" class="control-btn">撤销一笔</button>
        <button id="resetBtn" class="control-btn">重新绘画</button>
    </div>

    <script>
        // ========== DOM元素获取 ==========
        const drawCanvas = document.getElementById('drawCanvas');
        const drawCtx = drawCanvas.getContext('2d');
        const drawContainer = document.getElementById('drawContainer');
        const finishBtn = document.getElementById('finishBtn');
        const continueBtn = document.getElementById('continueBtn');
        const undoBtn = document.getElementById('undoBtn');
        const resetBtn = document.getElementById('resetBtn');
        const eraserBtn = document.getElementById('eraserBtn');
        
        const graphicsContainer = document.getElementById('graphicsContainer');
        const graphicsCanvas = document.getElementById('graphicsCanvas');
        const graphicsCtx = graphicsCanvas.getContext('2d');
        
        const hint = document.getElementById('hint');
        const statusText = document.getElementById('statusText');
        const rmsValue = document.getElementById('rmsValue');
        const normValue = document.getElementById('normValue');
        const scaleValue = document.getElementById('scaleValue');
        const volumeBar = document.getElementById('volumeBar');

        // 画笔控制元素
        const colorBtns = document.querySelectorAll('.color-btn');
        const customColor = document.getElementById('customColor');
        const sizeSlider = document.getElementById('sizeSlider');
        const sizeText = document.getElementById('sizeText');

        // ========== 全局配置 ==========
        let isDrawing = false;
        let lineWidth = 4;
        let lineColor = '#0066ff';
        let isEraser = false; // 橡皮擦开关
        let points = [];
        const smoothStep = 8;
        
        // 绘画历史（撤销/继续绘画）
        let pathHistory = [];
        let currentPath = [];

        // 音频配置
        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let animationFrameId = null;
        let currentScale = 1;
        const minScale = 1;
        const maxScale = 6;
        const smoothFactor = 0.3;
        const noiseThreshold = 0.02;
        const sensitivity = 0.3;

        // ========== 初始化画布 ==========
        function initDrawCanvas() {
            updatePenStyle();
        }

        // 更新画笔/橡皮擦样式
        function updatePenStyle() {
            drawCtx.lineWidth = lineWidth;
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
            
            if (isEraser) {
                // 橡皮擦模式：擦除内容
                drawCtx.globalCompositeOperation = 'destination-out';
                drawCtx.strokeStyle = 'rgba(0,0,0,1)';
            } else {
                // 画笔模式：正常绘画
                drawCtx.globalCompositeOperation = 'source-over';
                drawCtx.strokeStyle = lineColor;
            }
        }

        // 平滑绘画（抖动修正）
        function smoothDraw() {
            if (points.length < smoothStep) return;
            let smoothX = 0, smoothY = 0;
            for (let i = points.length - smoothStep; i < points.length; i++) {
                smoothX += points[i].x;
                smoothY += points[i].y;
            }
            smoothX /= smoothStep;
            smoothY /= smoothStep;

            drawCtx.lineTo(smoothX, smoothY);
            drawCtx.stroke();
            currentPath.push({
                x: smoothX, y: smoothY, 
                color: lineColor, width: lineWidth, 
                eraser: isEraser
            });
        }

        // 重绘所有笔画（撤销专用）
        function redrawAllPaths() {
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            pathHistory.forEach(path => {
                drawCtx.beginPath();
                drawCtx.lineWidth = path.width;
                drawCtx.lineCap = 'round';
                drawCtx.lineJoin = 'round';
                
                if (path.eraser) {
                    drawCtx.globalCompositeOperation = 'destination-out';
                } else {
                    drawCtx.globalCompositeOperation = 'source-over';
                    drawCtx.strokeStyle = path.color;
                }
                
                path.points.forEach((p, index) => {
                    if (index === 0) drawCtx.moveTo(p.x, p.y);
                    else drawCtx.lineTo(p.x, p.y);
                });
                drawCtx.stroke();
            });
            updatePenStyle();
        }

        // ========== 绘画事件 ==========
        drawCanvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const rect = drawCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            points = [];
            currentPath = [];
            points.push({x, y});
            currentPath.push({x, y, color: lineColor, width: lineWidth, eraser: isEraser});
            drawCtx.beginPath();
            drawCtx.moveTo(x, y);
        });

        drawCanvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const rect = drawCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            points.push({x, y});
            smoothDraw();
        });

        ['mouseup', 'mouseout'].forEach(event => {
            drawCanvas.addEventListener(event, () => {
                if (isDrawing && currentPath.length > 0) {
                    pathHistory.push({
                        points: [...currentPath],
                        color: lineColor,
                        width: lineWidth,
                        eraser: isEraser
                    });
                }
                isDrawing = false;
            });
        });

        // ========== 橡皮擦功能 ==========
        eraserBtn.addEventListener('click', () => {
            isEraser = true;
            colorBtns.forEach(b => b.classList.remove('active'));
            eraserBtn.classList.add('active');
            updatePenStyle();
            hint.textContent = '🧽 已切换为橡皮擦模式，可擦除绘画内容';
        });

        // ========== 画笔颜色控制 ==========
        colorBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                isEraser = false;
                eraserBtn.classList.remove('active');
                colorBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                lineColor = btn.dataset.color;
                updatePenStyle();
                hint.textContent = '🎨 已切换为画笔模式';
            });
        });

        customColor.addEventListener('input', () => {
            isEraser = false;
            eraserBtn.classList.remove('active');
            colorBtns.forEach(b => b.classList.remove('active'));
            lineColor = customColor.value;
            updatePenStyle();
        });

        // ========== 大小调节（同步画笔/橡皮擦） ==========
        sizeSlider.addEventListener('input', () => {
            lineWidth = sizeSlider.value;
            sizeText.textContent = lineWidth;
            updatePenStyle();
        });

        // ========== 核心1：撤销一笔 ==========
        undoBtn.addEventListener('click', () => {
            if (pathHistory.length === 0) {
                hint.textContent = '⚠️ 已经没有笔画可以撤销了！';
                return;
            }
            pathHistory.pop();
            redrawAllPaths();
            hint.textContent = '✅ 已撤销上一笔！';
        });

        // ========== 核心2：绘画完成 ==========
        finishBtn.addEventListener('click', () => {
            if (pathHistory.length === 0) {
                hint.textContent = '⚠️ 请先绘画再点击完成！';
                return;
            }

            syncGraphicsCanvas();
            drawContainer.style.display = 'none';
            graphicsContainer.style.display = 'flex';
            
            finishBtn.style.display = 'none';
            continueBtn.style.display = 'block';
            undoBtn.style.display = 'none';
            resetBtn.style.display = 'none';
            
            finishBtn.disabled = true;
            hint.textContent = '✅ 声控已激活！声音越大，图形越大越亮~';
            initAudio();
        });

        // ========== 核心3：继续绘画 ==========
        continueBtn.addEventListener('click', () => {
            stopAudio();
            drawContainer.style.display = 'flex';
            graphicsContainer.style.display = 'none';
            
            finishBtn.style.display = 'block';
            continueBtn.style.display = 'none';
            undoBtn.style.display = 'block';
            resetBtn.style.display = 'block';
            
            finishBtn.disabled = false;
            statusText.textContent = '继续绘画中';
            hint.textContent = '✅ 已回到绘画状态！';
        });

        // ========== 重新绘画 ==========
        resetBtn.addEventListener('click', () => {
            stopAudio();
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            pathHistory = [];
            currentPath = [];
            
            drawContainer.style.display = 'flex';
            graphicsContainer.style.display = 'none';
            
            finishBtn.style.display = 'block';
            continueBtn.style.display = 'none';
            undoBtn.style.display = 'block';
            resetBtn.style.display = 'block';
            
            finishBtn.disabled = false;
            statusText.textContent = '等待绘画';
            hint.textContent = '按住鼠标绘画 | 橡皮擦可擦除 | 撤销逐笔回退';
        });

        // ========== 统一停止音频 ==========
        function stopAudio() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            if (audioContext) {
                audioContext.close().catch(() => {});
                audioContext = null;
            }
            analyser = null;
            dataArray = null;
            currentScale = 1;
            rmsValue.textContent = '0.000';
            normValue.textContent = '0.00';
            scaleValue.textContent = '1.00x';
            volumeBar.style.width = '0%';
        }

        // ========== 工具函数 ==========
        function syncGraphicsCanvas() {
            graphicsCanvas.width = drawCanvas.width;
            graphicsCanvas.height = drawCanvas.height;
            graphicsCtx.drawImage(drawCanvas, 0, 0);
        }

        // ========== 音频声控 ==========
        async function initAudio() {
            try {
                statusText.textContent = '请求麦克风权限...';
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContext();

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 1024;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                source.connect(analyser);

                statusText.textContent = '✅ 声控已激活！';
                renderGraphics();

            } catch (error) {
                console.error(error);
                statusText.textContent = '❌ 麦克风未授权';
                hint.textContent = '请允许麦克风权限，或点击重新绘画';
                finishBtn.disabled = false;
            }
        }

        function renderGraphics() {
            if (!analyser || !audioContext) return;
            animationFrameId = requestAnimationFrame(renderGraphics);

            analyser.getByteTimeDomainData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                const n = (dataArray[i] - 128) / 128;
                sum += n * n;
            }
            const rms = Math.sqrt(sum / dataArray.length);

            rmsValue.textContent = rms.toFixed(3);
            const vol = Math.min(1, Math.max(0, rms - noiseThreshold) / sensitivity);
            normValue.textContent = vol.toFixed(2);
            volumeBar.style.width = vol * 100 + '%';

            currentScale += (minScale + vol * (maxScale - minScale) - currentScale) * smoothFactor;
            scaleValue.textContent = currentScale.toFixed(2) + 'x';

            graphicsCanvas.style.transform = `scale(${currentScale})`;
            graphicsCanvas.style.filter = `
                drop-shadow(0 0 ${20 + vol * 80}px rgba(0, 102, 255, ${0.8 + vol * 0.2}))
            `;
        }

        // 启动初始化
        initDrawCanvas();
    </script>
</body>
</html>
