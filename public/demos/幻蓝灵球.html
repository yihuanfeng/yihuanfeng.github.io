<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声控魔法球 - 增强调试版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #050510;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
        }

        /* 调试面板样式 */
        .debug-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            z-index: 1000;
            min-width: 280px;
            border: 1px solid #333;
        }

        .debug-panel h3 {
            margin-bottom: 10px;
            color: #fff;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        .debug-item {
            margin: 5px 0;
        }

        .debug-label {
            color: #aaa;
        }

        .debug-value {
            color: #00ff00;
            font-weight: bold;
        }

        /* 音量进度条 */
        .volume-bar-container {
            width: 100%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }

        .volume-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ff00, #ffff00, #ff0000);
            transition: width 0.05s linear;
        }

        /* 魔法球容器 */
        .ball-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }

        /* 魔法球核心样式 - 增大基础尺寸 */
        #magicBall {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #66d9ff 30%, #0066ff 60%, #001a33 100%);
            box-shadow: 
                0 0 30px rgba(102, 217, 255, 0.8),
                0 0 60px rgba(0, 102, 255, 0.6),
                0 0 90px rgba(0, 102, 255, 0.4);
            transform: scale(1);
            transition: transform 0.05s ease-out;
            z-index: 2;
        }

        /* 外层扩散光晕 */
        .ball-glow {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(102, 217, 255, 0.2);
            filter: blur(40px);
            transform: scale(1);
            transition: transform 0.05s ease-out;
            z-index: 1;
        }

        /* 提示文字 */
        #hint {
            color: #ffffff;
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
            opacity: 0.9;
            max-width: 80%;
            line-height: 1.5;
        }

        /* 启动按钮 */
        #startBtn {
            padding: 12px 36px;
            font-size: 18px;
            font-weight: 500;
            color: #050510;
            background: linear-gradient(90deg, #66d9ff, #0066ff);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.4);
        }

        #startBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 102, 255, 0.6);
        }

        #startBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <!-- 调试面板 -->
    <div class="debug-panel">
        <h3>🔧 调试信息面板</h3>
        <div class="debug-item">
            <span class="debug-label">状态：</span>
            <span class="debug-value" id="statusText">等待启动</span>
        </div>
        <div class="debug-item">
            <span class="debug-label">原始音量(RMS)：</span>
            <span class="debug-value" id="rmsValue">0.000</span>
        </div>
        <div class="debug-item">
            <span class="debug-label">归一化音量：</span>
            <span class="debug-value" id="normValue">0.00</span>
        </div>
        <div class="debug-item">
            <span class="debug-label">当前缩放：</span>
            <span class="debug-value" id="scaleValue">1.00x</span>
        </div>
        <div class="volume-bar-container">
            <div class="volume-bar" id="volumeBar"></div>
        </div>
    </div>

    <div class="ball-container">
        <div id="magicBall"></div>
        <div class="ball-glow"></div>
    </div>
    <p id="hint">点击下方按钮，授予麦克风权限，对着麦克风说话，魔法球会随你的声音大小变化~</p>
    <button id="startBtn">开启声控魔法</button>

    <script>
        // DOM元素获取
        const magicBall = document.getElementById('magicBall');
        const ballGlow = document.querySelector('.ball-glow');
        const hint = document.getElementById('hint');
        const startBtn = document.getElementById('startBtn');
        
        // 调试元素
        const statusText = document.getElementById('statusText');
        const rmsValue = document.getElementById('rmsValue');
        const normValue = document.getElementById('normValue');
        const scaleValue = document.getElementById('scaleValue');
        const volumeBar = document.getElementById('volumeBar');

        // 音频核心变量
        let audioContext;
        let analyser;
        let dataArray;
        let animationFrameId;

        // 动画配置 - 大幅增加变化幅度
        let currentScale = 1;
        const minScale = 1;       // 最小尺寸
        const maxScale = 6;       // 最大放大6倍！
        const smoothFactor = 0.3; // 响应更快
        const noiseThreshold = 0.02; // 底噪阈值
        const sensitivity = 0.3;  // 灵敏度调整

        // 初始化麦克风与音频分析器
        async function initAudio() {
            try {
                statusText.textContent = '正在初始化...';
                
                // 兼容webkit内核浏览器
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContext();

                statusText.textContent = '正在请求麦克风权限...';

                // 申请麦克风权限
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false, // 关闭回声消除，提高灵敏度
                        noiseSuppression: false, // 关闭降噪，提高灵敏度
                        autoGainControl: true    // 开启自动增益
                    }
                });

                statusText.textContent = '正在创建音频节点...';

                // 创建音频源与分析器节点
                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 1024; // 降低采样精度，提高响应速度
                analyser.smoothingTimeConstant = 0.1; // 减少平滑，提高灵敏度
                
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);

                // 连接音频节点
                source.connect(analyser);

                // 更新UI状态
                statusText.textContent = '✅ 运行正常！请说话';
                hint.textContent = '魔法已激活！看着左上角的调试面板，对着麦克风大声说话吧~';
                startBtn.textContent = '魔法运行中';
                startBtn.disabled = true;

                // 启动实时渲染循环
                renderBall();

            } catch (error) {
                console.error('初始化失败：', error);
                statusText.textContent = '❌ 错误：' + error.name;
                
                if (error.name === 'NotAllowedError') {
                    hint.textContent = '麦克风权限被拒绝，请在浏览器地址栏左侧开启麦克风权限，刷新页面重试。';
                } else if (error.name === 'NotFoundError') {
                    hint.textContent = '未检测到可用的麦克风设备，请检查你的麦克风是否正常连接。';
                } else {
                    hint.textContent = '初始化失败：' + error.message;
                }
                startBtn.disabled = false;
            }
        }

        // 实时渲染魔法球
        function renderBall() {
            // 持续循环渲染
            animationFrameId = requestAnimationFrame(renderBall);

            if (!analyser || !dataArray) return;

            // 获取时域音频数据
            analyser.getByteTimeDomainData(dataArray);

            // 计算RMS均方根音量
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                const normalized = (dataArray[i] - 128) / 128;
                sum += normalized * normalized;
            }
            const rms = Math.sqrt(sum / dataArray.length);

            // 显示原始RMS值
            rmsValue.textContent = rms.toFixed(3);

            // 处理音量：减去底噪，乘以灵敏度
            let processedVolume = Math.max(0, rms - noiseThreshold) * (1 / sensitivity);
            
            // 归一化到0-1范围
            const normalizedVolume = Math.min(1, processedVolume);
            
            // 显示归一化音量
            normValue.textContent = normalizedVolume.toFixed(2);
            
            // 更新音量条
            volumeBar.style.width = (normalizedVolume * 100) + '%';

            // 映射到缩放比例 (变化幅度超大！)
            const targetScale = minScale + normalizedVolume * (maxScale - minScale);

            // 平滑过渡
            currentScale += (targetScale - currentScale) * smoothFactor;

            // 显示当前缩放
            scaleValue.textContent = currentScale.toFixed(2) + 'x';

            // 应用缩放：核心球 + 外层光晕
            magicBall.style.transform = `scale(${currentScale})`;
            ballGlow.style.transform = `scale(${currentScale * 2.5})`;

            // 动态调整发光强度
            const glowIntensity = normalizedVolume;
            magicBall.style.boxShadow = `
                0 0 ${30 + glowIntensity * 100}px rgba(102, 217, 255, ${0.8 + glowIntensity * 0.2}),
                0 0 ${60 + glowIntensity * 150}px rgba(0, 102, 255, ${0.6 + glowIntensity * 0.3}),
                0 0 ${90 + glowIntensity * 200}px rgba(0, 102, 255, ${0.4 + glowIntensity * 0.4})
            `;
        }

        // 按钮点击事件
        startBtn.addEventListener('click', () => {
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
                statusText.textContent = '✅ 运行正常！请说话';
            } else if (!audioContext) {
                initAudio();
            }
        });

        // 页面卸载时清理资源
        window.addEventListener('beforeunload', () => {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            if (audioContext) audioContext.close();
        });
    </script>
</body>
</html>
