<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>五角星烟花画板</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#000;}
  canvas{
    display:block;
    width:100%;
    height:100%;
    /* background:#000; */
    touch-action:none;
  }
</style>
</head>
<body>
<canvas id="cvs"></canvas>
<div id="container" style="color: #fff; text-align: center; position: absolute; top: 0;width: 100%; font-size: 36px;opacity: 0.5;">滑动画布查看效果！</div>
<script>
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
let w, h;
function resize(){
  w = cvs.width = window.innerWidth;
  h = cvs.height = window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

// 画五角星
function drawStar(cx,cy,size,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  for(let i=0;i<5;i++){
    let ang = Math.PI*2*i/5 - Math.PI/2;
    let x = cx + Math.cos(ang)*size;
    let y = cy + Math.sin(ang)*size;
    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
    ang += Math.PI/5;
    x = cx + Math.cos(ang)*(size*0.4);
    y = cy + Math.sin(ang)*(size*0.4);
    ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fill();
}

// 粒子（小五角星）
class StarParticle{
  constructor(x,y){
    this.x=x;
    this.y=y;
    this.vx=(Math.random()-0.5)*6;
    this.vy=(Math.random()-0.5)*6;
    this.size=Math.random()*2+1;
    this.alpha=1;
    this.life=1;
    this.color=`hsl(${Math.random()*360},100%,60%)`;
  }
  update(){
    this.x+=this.vx;
    this.y+=this.vy;
    this.vy+=0.05;
    this.life-=0.015;
    this.alpha=this.life;
  }
  draw(){
    ctx.globalAlpha=this.alpha;
    drawStar(this.x,this.y,this.size,this.color);
    ctx.globalAlpha=1;
  }
}

let particles=[];
let isDown=false;
let lastX=0,lastY=0;

// 爆炸
function explode(x,y){
  for(let i=0;i<80;i++) particles.push(new StarParticle(x,y));
}

// 鼠标/触摸
cvs.addEventListener('mousedown',e=>{
  isDown=true;
  [lastX,lastY]=[e.offsetX,e.offsetY];
});
cvs.addEventListener('mousemove',e=>{
  if(!isDown) return;
  const x=e.offsetX,y=e.offsetY;
  drawStar(x,y,8,'#fff');
  if(Math.random()<0.15) explode(x,y);
});
cvs.addEventListener('mouseup',()=>isDown=false);
cvs.addEventListener('mouseleave',()=>isDown=false);

// 触摸支持
cvs.addEventListener('touchstart',e=>{
  e.preventDefault();
  isDown=true;
  const t=e.touches[0];
  const rect=cvs.getBoundingClientRect();
  lastX=t.clientX-rect.left;
  lastY=t.clientY-rect.top;
});
cvs.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!isDown) return;
  const t=e.touches[0];
  const rect=cvs.getBoundingClientRect();
  const x=t.clientX-rect.left;
  const y=t.clientY-rect.top;
  drawStar(x,y,8,'#fff');
  if(Math.random()<0.15) explode(x,y);
});
cvs.addEventListener('touchend',()=>isDown=false);

// 动画
function loop(){
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.fillRect(0,0,w,h);
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.update();
    p.draw();
    if(p.life<=0) particles.splice(i,1);
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
