<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>电子万花尺</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f4f4f4;padding:10px;font-family:sans-serif}
  .title{text-align:center;font-size:22px;margin:10px 0}
  .control{background:white;padding:15px;border-radius:10px;margin-bottom:10px}
  .item{margin-bottom:10px}
  label{font-size:14px;display:block;margin-bottom:4px}
  input{width:100%}
  .btn-box{display:flex;gap:10px;margin-top:10px}
  button{flex:1;padding:10px;border:none;border-radius:6px;color:white;font-size:15px}
  #start{background:#4285F4}
  #stop{background:#ff9800}
  #reset{background:#f44336}
  canvas{display:block;width:100%;height:auto;background:white;border:2px solid #000;border-radius:8px}
</style>
</head>
<body>
  <div class="title">电子万花尺</div>
  <div class="control">
    <div class="item">
      <label>大圆半径</label>
      <input type="range" id="outer" min="40" max="160" value="120">
    </div>
    <div class="item">
      <label>小圆半径</label>
      <input type="range" id="inner" min="10" max="100" value="40">
    </div>
    <div class="item">
      <label>画笔位置</label>
      <input type="range" id="penD" min="5" max="60" value="25">
    </div>
    <div class="item">
      <label>绘画速度</label>
      <input type="range" id="speed" min="0.01" max="0.5" step="0.01" value="0.08">
    </div>
    <div class="item">
      <label>线条粗细</label>
      <input type="range" id="lineWidth" min="0.2" max="4" step="0.1" value="0.6">
    </div>
    <div class="item">
      <label>尖度（越大越锋利）</label>
      <input type="range" id="sharp" min="0.02" max="3" step="0.01" value="0.1">
    </div>
    <div class="btn-box">
      <button id="start">开始绘画</button>
      <button id="stop">停止</button>
      <button id="reset">重置</button>
    </div>
  </div>
  <canvas id="canvas" width="360" height="360"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let anim = null;
let t = 0;
let lastX, lastY;

function stopDraw() {
  cancelAnimationFrame(anim);
  anim = null;
}

function reset() {
  stopDraw();
  t = 0;
  lastX = lastY = null;
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

function draw() {
  let outerVal = parseInt(document.getElementById('outer').value);
  let innerVal = parseInt(document.getElementById('inner').value);
  
  // 核心对应逻辑：外围大圆 & 中间空白小圆
  let A = outerVal;
  let B = innerVal;
  
  let d = parseInt(document.getElementById('penD').value);
  let speed = parseFloat(document.getElementById('speed').value);
  let width = parseFloat(document.getElementById('lineWidth').value);
  let sharp = parseFloat(document.getElementById('sharp').value);
  let cx = canvas.width / 2;
  let cy = canvas.height / 2;

  // 永不闭合核心代码：微小偏移系数，永远不回原点、不重复
  let f = 1.000007;
  let k = (A - B) / B * sharp * f;
  
  let x = cx + (A - B) * Math.cos(t) + d * Math.cos(k * t);
  let y = cy + (A - B) * Math.sin(t) - d * Math.sin(k * t);
  let hue = (t * 22) % 360;

  ctx.strokeStyle = `hsl(${hue}, 100%, 50%)`;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';

  if (lastX != null) {
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.stroke();
  }

  lastX = x;
  lastY = y;
  t += speed;
  anim = requestAnimationFrame(draw);
}

document.getElementById('start').onclick = () => {
  if (!anim) draw();
};
document.getElementById('stop').onclick = stopDraw;
document.getElementById('reset').onclick = reset;
</script>
</body>
</html>
